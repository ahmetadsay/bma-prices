name: Check prices

on:
  schedule:
    - cron: "0 19 */3 * *"     # 05:00 in Sydney, every third day
  workflow_dispatch:            # the "Run workflow" button, for a check on demand

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Read prices
        run: python fetch_prices.py
      - name: Save
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "prices: $(date -u +%Y-%m-%d)" || echo "nothing changed"
          git push
